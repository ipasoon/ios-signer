    async function downloadCertZip(certKey, event) {
        const cert = certs[certKey];
        const btn = event.target;
        if (cert.zip && cert.zip !== "") {
            window.location.href = cert.zip;
            return;
        }
        btn.innerText = "...";
        try {
            const zip = new JSZip();
            const password = "alikareemsafi";
            const fetchFile = async (url) => {
                const response = await fetch(url);
                if (!response.ok) throw new Error();
                return await response.arrayBuffer();
            };
            const [p12Data, mpData] = await Promise.all([
                fetchFile(cert.p12),
                fetchFile(cert.mp)
            ]);
            zip.file(cert.name + ".p12", p12Data);
            zip.file(cert.name + ".mobileprovision", mpData);
            zip.file("Password.txt", "Certificate Password: " + password);
            const content = await zip.generateAsync({type: "blob"});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = cert.name + "_Pack.zip";
            link.click();
        } catch (e) {
            alert("يرجى استخدام متصفح سفاري.");
        } finally {
            btn.innerText = translations[currentLang].download;
        }
    }

        const btn = event.target;
        btn.innerText = "...";
        try {
            const response = await fetch(requestUrl);
            const data = await response.json();
            if (data.status === "ok" && data.link) {
                window.location.href = data.link;
                setTimeout(() => { window.location.href = "https://t.me/ipasoon"; }, 2000);
            } else { throw new Error(); }
        } catch (error) { window.open(requestUrl, '_blank'); } 
        finally { btn.innerText = translations[currentLang].install; }

            let zipHtml = '';
            Object.keys(certs).forEach(key => {
                zipHtml += `<div class="app"><div style="display:flex;align-items:center;gap:12px;"><div class="app-icon" style="background-image: url('${appImages["الشهادة"]}')"></div><div>${certs[key].name} Pack</div></div><button onclick="downloadCertZip('${key}', event)" class="install">${translations[currentLang].download}</button></div>`;
            });
            group.innerHTML = zipHtml; store.appendChild(group); return;
        }

        const groupConfigs = [
            { key: 'education', class: 'group-edu', label: translations[currentLang].groupEdu },
            { key: 'chiba', class: 'group-chiba', label: translations[currentLang].groupChiba },
            { key: 'central', class: 'group-central', label: translations[currentLang].groupCentral },
            { key: 'estate', class: 'group-estate', label: translations[currentLang].groupEstate },
            { key: 'esensoft', class: 'group-esensoft', label: translations[currentLang].groupEsensoft },
            { key: 'eryuan', class: 'group-eryuan', label: translations[currentLang].groupEryuan },
            { key: 'takeoff', class: 'group-takeoff', label: translations[currentLang].groupTakeoff },
            { key: 'hdfc', class: 'group-hdfc', label: translations[currentLang].groupHdfc },
            { key: 'toyota', class: 'group-toyota', label: translations[currentLang].groupToyota },
            { key: 'tianjin', class: 'group-tianjin', label: translations[currentLang].groupTianjin },
            { key: 'tcl', class: 'group-tcl', label: translations[currentLang].groupTcl },
            { key: 'viettel', class: 'group-viettel', label: translations[currentLang].groupViettel },
            { key: 'vietnamtech', class: 'group-vietnamtech', label: translations[currentLang].groupVietnamtech },
            { key: 'vietnambank', class: 'group-vietnambank', label: translations[currentLang].groupVietnambank },
            { key: 'wuling', class: 'group-wuling', label: translations[currentLang].groupWuling },
            { key: 'commission', class: 'group-com', label: translations[currentLang].groupCom }
        ];

        groupConfigs.forEach(config => {
            const gDiv = document.createElement('div'); gDiv.className = `signed-group ${config.class}`; gDiv.setAttribute('data-label', config.label);
            let hasApp = false;
            keysAr.forEach((keyAr, i) => {
                if (category === translations[currentLang].cats[0] || category === translations[currentLang].cats[i+1]) {
                    if(certs[config.key].p12) {
                        gDiv.innerHTML += createAppHTML(keyAr, appsList[i], config.key);
                        hasApp = true;
                    }
                }
            });
            if(hasApp) store.appendChild(gDiv);
        });
    }
    setLang('ar');

    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 40; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.width = Math.random() * 2 + 'px'; star.style.height = star.style.width;
        star.style.top = Math.random() * 100 + '%'; star.style.left = Math.random() * 100 + '%';
        star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
        starsContainer.appendChild(star);
    }
</script>
</body>
