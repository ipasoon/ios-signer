name: iOS App Signer
on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup ZSign
        run: |
          git clone https://github.com/zhlynn/zsign.git
          cd zsign && g++ *.cpp -lcrypto -O3 -o zsign
          sudo cp zsign /usr/local/bin/

      - name: Prepare Certificates
        run: |
          echo "${{ secrets.P12_BASE64 }}" | base64 -d > cert.p12
          echo "${{ secrets.PROVISION_BASE64 }}" | base64 -d > dev.mobileprovision

      - name: Find and Sign IPA
        run: |
          # هذا السطر هو "الجوكر" يبحث عن أي ملف ipa ويوقعه
          IPA_FILE=$(ls *.ipa | head -n 1)
          echo "Found file: $IPA_FILE"
          zsign -k cert.p12 -p ${{ secrets.P12_PASSWORD }} -m dev.mobileprovision -o Signed_Output.ipa "$IPA_FILE"

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Signed-App-Success
          path: Signed_Output.ipa
