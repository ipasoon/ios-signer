name: iOS App Signer
on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download IPA from Release
        run: |
          # سحب رابط ملف الـ IPA من الـ Releases
          URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | grep "browser_download_url" | cut -d '"' -f 4 | grep ".ipa" | head -n 1)
          echo "Downloading: $URL"
          curl -L "$URL" -o app.ipa

      - name: Setup ZSign
        run: |
          git clone https://github.com/zhlynn/zsign.git
          cd zsign && g++ *.cpp -lcrypto -O3 -o zsign
          sudo cp zsign /usr/local/bin/

      - name: Prepare Secrets
        run: |
          echo "${{ secrets.P12_BASE64 }}" | base64 -d > cert.p12
          echo "${{ secrets.PROVISION_BASE64 }}" | base64 -d > dev.mobileprovision

      - name: Sign IPA
        run: |
          zsign -k cert.p12 -p ${{ secrets.P12_PASSWORD }} -m dev.mobileprovision -o signed.ipa app.ipa

      - name: Upload Signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Application
          path: signed.ipa
