name: iOS App Signer
on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sign IPA
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.P12_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install Provisioning Profile
        uses: apple-actions/download-provisioning-profile@v3
        with:
          bundle-id: '*'
          profile-base64: ${{ secrets.PROVISION_BASE64 }}

      - name: Execute Signing
        run: |
          # أمر بسيط لتوقيع ملفك الموجود مسبقاً ESign.ipa
          xcrun codesign -f -s "iPhone Distribution" --provisioning-profile *.mobileprovision ESign.ipa
          mv ESign.ipa ESign_Signed.ipa

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Final-Signed-App
          path: ESign_Signed.ipa
