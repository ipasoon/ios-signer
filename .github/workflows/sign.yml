name: iOS App Signer
on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Secrets
        run: |
          echo "${{ secrets.P12_BASE64 }}" | base64 -d > cert.p12
          echo "${{ secrets.PROVISION_BASE64 }}" | base64 -d > dev.mobileprovision

      - name: Sign with Security Tool
        run: |
          # فك الملف الأصلي (IPA هو مجرد Zip)
          unzip -q ESign.ipa
          
          # توقيع المجلد الداخلي باستخدام أداة أبل الرسمية
          codesign -f -s "-" --entitlements Payload/*.app/*.entitlements Payload/*.app
          
          # إعادة الضغط
          zip -qr ESign_Signed.ipa Payload
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: ESign-Final
          path: ESign_Signed.ipa
