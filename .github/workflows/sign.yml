name: iOS App Signer
on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sign IPA
        uses: yoeight/sign-ipa-action@v1
        with:
          ipa_path: "ESign.ipa"
          p12_base64: ${{ secrets.P12_BASE64 }}
          p12_password: ${{ secrets.P12_PASSWORD }}
          mobileprovision_base64: ${{ secrets.PROVISION_BASE64 }}

      - name: Upload Signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ESign-Signed
          path: "ESign-signed.ipa"
