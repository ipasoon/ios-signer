name: iOS App Signer
on:
  workflow_dispatch:
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup ZSign
        run: |
          git clone https://github.com/zhlynn/zsign.git
          cd zsign && g++ *.cpp -lcrypto -O3 -o zsign
          sudo cp zsign /usr/local/bin/
      - name: Prepare
        run: |
          echo "${{ secrets.P12_BASE64 }}" | base64 -d > cert.p12
          echo "${{ secrets.PROVISION_BASE64 }}" | base64 -d > dev.mobileprovision
      - name: Sign
        run: |
          if [ -f "app.ipa" ]; then
            zsign -k cert.p12 -p ${{ secrets.P12_PASSWORD }} -m dev.mobileprovision -o signed.ipa app.ipa
          else
            echo "Error: app.ipa not found"
            exit 1
          fi
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: Signed-IPA
          path: signed.ipa
